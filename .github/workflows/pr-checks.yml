name: PR Verification & Safety Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-and-scan:
    name: Validate Structure & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Git Conflict Markers
        run: |
          echo "Scanning for Git conflict markers..."
          if grep -rnE '^[<]{7} |^[=]{7}$|^[>]{7} ' . --exclude-dir=".git" --exclude-dir=".github"; then
            echo "Error: Found Git conflict markers in codebase!"
            exit 1
          fi
          echo "No conflict markers found."

      - name: Verify Document Hierarchy and File Integrity
        run: |
          echo "Checking expected repository structure..."
          test -f README.md || { echo "Missing README.md"; exit 1; }
          test -d docs/reports || { echo "Missing docs/reports"; exit 1; }
          test -d docs/presentation || { echo "Missing docs/presentation"; exit 1; }
          test -d docs/references || { echo "Missing docs/references"; exit 1; }
          echo "Repository structure verified."

      - name: Scan for Exposed Credentials and Private Keys
        run: |
          echo "Scanning for exposed credentials..."
          if grep -rnE 'BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}' . --exclude-dir=".git" --exclude-dir=".github"; then
            echo "Error: Potential private key or credential found!"
            exit 1
          fi
          echo "No exposed credentials detected."
